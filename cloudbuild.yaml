steps:
  # 1. Build container image for FleetFlow Control Tower + ADK Backend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/fleetflow-control-tower:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/fleetflow-control-tower:latest'
      - '.'

  # 2. Push image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/fleetflow-control-tower'

  # 3. Deploy container to Google Cloud Run wired to BigQuery, Vertex AI & GCS
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'fleetflow-control-tower'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/fleetflow-control-tower:latest'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '20'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${_REGION},GOOGLE_GENAI_USE_VERTEXAI=true,LOADPILOT_BQ_PROJECT=${PROJECT_ID},LOADPILOT_BQ_DATASET=loadpilot_demo,LOADPILOT_MEDIA_BUCKET=${PROJECT_ID}-loadpilot-media'

substitutions:
  _REGION: us-central1
  _REPO: fleetflow-containers

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/fleetflow-control-tower:latest'
